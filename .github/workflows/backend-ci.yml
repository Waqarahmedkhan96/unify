name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "Directory.Build.props"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "Directory.Build.props"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/Unify.Erp.sln

      - name: Build
        run: dotnet build backend/Unify.Erp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/Unify.Erp.sln --configuration Release --no-build
