services:
  api:
    ports: []
    expose:
      - "8080"

  caddy:
    image: caddy:2.8-alpine
    container_name: unify-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      UNIFY_DOMAIN: ${UNIFY_DOMAIN:-api.example.com}
      UNIFY_TLS_EMAIL: ${UNIFY_TLS_EMAIL:-admin@example.com}
    ports:
      - "${HTTPS_HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/reverse-proxy/Caddyfile.production.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
