services:
  postgres:
    image: postgres:16-alpine
    container_name: unify-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unify_erp}
      POSTGRES_USER: ${POSTGRES_USER:-unify_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_development_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - unify_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unify_app} -d ${POSTGRES_DB:-unify_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: unify-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-unify_erp};Username=${POSTGRES_USER:-unify_app};Password=${POSTGRES_PASSWORD:-change_this_development_password}
    ports:
      - "${API_HTTP_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  unify_postgres_data:
